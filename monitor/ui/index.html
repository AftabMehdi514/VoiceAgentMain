<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tania Ops Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=20">
</head>
<body>
    <div class="app-bg"></div>

    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">T</div>
            <div class="brand-text">
                <h1>Tania</h1>
                <span class="brand-sub">Ops Console</span>
            </div>
        </div>

        <div class="kpi-strip" id="kpi-strip">
            <div class="kpi"><span class="kpi-label">Turn p50</span><span class="kpi-value" id="kpi-turn">—</span></div>
            <div class="kpi"><span class="kpi-label">LLM p50</span><span class="kpi-value" id="kpi-llm">—</span></div>
            <div class="kpi"><span class="kpi-label">Tool p50</span><span class="kpi-value" id="kpi-tool">—</span></div>
            <div class="kpi"><span class="kpi-label">Tool errors</span><span class="kpi-value" id="kpi-terr">—</span></div>
            <div class="kpi"><span class="kpi-label">Guards</span><span class="kpi-value" id="kpi-guards">—</span></div>
        </div>

        <div class="top-status">
            <div class="conn" id="conn-badge"><span class="dot"></span><span id="conn-text">Connecting</span></div>
            <div class="agent-status" id="agent-status">
                <span class="pulse idle" id="pulse"></span>
                <span id="status-text">Idle</span>
            </div>
        </div>
    </header>

    <div class="pipeline" id="pipeline">
        <div class="pipe-node" data-step="input"><span class="pipe-label">Input</span></div>
        <div class="pipe-line" data-line="1"></div>
        <div class="pipe-node" data-step="llm"><span class="pipe-label">LLM</span></div>
        <div class="pipe-line" data-line="2"></div>
        <div class="pipe-node" data-step="guard"><span class="pipe-label">Guards</span></div>
        <div class="pipe-line" data-line="3"></div>
        <div class="pipe-node" data-step="tool"><span class="pipe-label">Tools</span></div>
    </div>

    <main class="console">
        <aside class="pane left-pane glass">
            <div class="pane-header left-head">
                <div class="left-head-row">
                    <h2>Sessions</h2>
                    <button class="btn ghost sm" id="btn-clear-sessions" type="button" title="Clear session list">Clear</button>
                </div>
                <div class="filters">
                    <input type="search" id="filter-q" placeholder="Search turns…" />
                    <select id="filter-mode">
                        <option value="all">All turns</option>
                        <option value="errors">Errors</option>
                        <option value="tools">With tools</option>
                        <option value="guards">With guards</option>
                        <option value="slow">Slow (&gt;5s)</option>
                    </select>
                </div>
            </div>
            <div id="session-list" class="session-list">
                <div class="empty">Waiting for agent activity…</div>
            </div>
        </aside>

        <section class="pane center-pane glass">
            <div class="pane-header">
                <div>
                    <h2 id="waterfall-title">Turn Flow</h2>
                    <p class="muted" id="waterfall-sub">Select a turn on the left</p>
                </div>
                <div class="header-actions">
                    <button class="btn ghost" id="btn-export-turn" disabled>Export turn</button>
                    <button class="btn ghost" id="btn-export-session" disabled>Export session</button>
                </div>
            </div>
            <div id="waterfall" class="waterfall">
                <div class="empty">No turn selected</div>
            </div>
        </section>

        <aside class="pane right-pane glass">
            <div class="tabs">
                <button class="tab active" data-tab="state">State</button>
                <button class="tab" data-tab="metrics">Metrics</button>
                <button class="tab" data-tab="prompt">Prompt</button>
            </div>

            <div id="tab-state" class="tab-panel active">
                <div id="state-content" class="tab-body">
                    <div class="empty">Select a turn to see before / after state</div>
                </div>
                <div id="context-usage" class="context-usage" hidden></div>
            </div>

            <div id="tab-metrics" class="tab-panel">
                <div id="metrics-content" class="tab-body"></div>
            </div>

            <div id="tab-prompt" class="tab-panel">
                <div class="prompt-toolbar">
                    <div class="prompt-mode">
                        <button class="chip active" id="btn-prompt-view" type="button">View</button>
                        <button class="chip" id="btn-prompt-edit" type="button">Edit rules</button>
                    </div>
                    <span class="muted" id="prompt-saved">Not saved</span>
                    <button class="btn primary" id="btn-save-prompt" hidden>Save</button>
                </div>
                <div id="prompt-view" class="prompt-view tab-body"></div>
                <textarea id="prompt-editor" class="prompt-editor" spellcheck="false" hidden></textarea>
            </div>
        </aside>
    </main>

    <script src="/static/app.js?v=20"></script>
</body>
</html>
